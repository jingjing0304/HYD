<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ 我们的回忆扭蛋机</title>
    <style>
        :root {
            --primary-color: #ff7675;
            --secondary-color: #a29bfe;
            --bg-color: #fff0f3;
            --machine-bg: #fff;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px;
        }

        /* 移除了导航栏，因为不再需要后台添加功能了 */
        
        .machine-container {
            background: var(--machine-bg);
            padding: 40px; border-radius: 40px;
            box-shadow: 0 20px 50px rgba(255, 118, 117, 0.15);
            display: flex; flex-direction: column; align-items: center;
            margin-top: 20px;
        }

        .gacha-machine {
            width: 280px; height: 420px;
            position: relative; display: flex; flex-direction: column; align-items: center;
        }

        .globe {
            width: 220px; height: 220px;
            background: rgba(255, 255, 255, 0.4);
            border: 6px solid var(--primary-color);
            border-radius: 50%;
            position: relative; overflow: hidden; z-index: 2;
            box-shadow: inset -5px -5px 15px rgba(255, 118, 117, 0.1);
            display: flex; justify-content: center;
        }

        .ball-deco {
            width: 35px; height: 35px; border-radius: 50%;
            position: absolute; border: 2px solid rgba(0,0,0,0.05);
            /* Q弹动画效果 */
            transition: transform 0.3s ease-in-out; 
            display: flex; justify-content: center; align-items: center;
            font-size: 16px;
            bottom: 20px; 
        }

        .base {
            width: 240px; height: 180px;
            background-color: var(--primary-color);
            border-radius: 20px 20px 35px 35px;
            margin-top: -30px; z-index: 1;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            padding-bottom: 20px;
        }

        .knob-area {
            width: 70px; height: 70px;
            background: #fff; border-radius: 50%;
            border: 4px solid #fab1a0;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 15px;
            box-shadow: 0 5px 0 rgba(0,0,0,0.1);
            cursor: pointer;
        }
        .knob-bar { width: 60%; height: 8px; background: #fab1a0; border-radius: 4px; }
        .knob-area.spinning { animation: spinKnob 1.5s linear infinite; }

        .exit { width: 90px; height: 35px; background: #2d3436; border-radius: 10px 10px 18px 18px; }

        .start-btn {
            margin-top: 30px; padding: 12px 40px;
            background: linear-gradient(45deg, #ff7675, #fab1a0);
            color: white; border: none; border-radius: 50px;
            font-size: 18px; font-weight: bold; letter-spacing: 2px;
            cursor: pointer; box-shadow: 0 5px 15px rgba(255, 118, 117, 0.4);
            transition: transform 0.2s;
        }
        .start-btn:active { transform: scale(0.95); }
        .start-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

        /* 弹窗样式 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none; justify-content: center; align-items: center;
            z-index: 100; backdrop-filter: blur(4px);
        }

        .polaroid-card {
            background: white; padding: 15px 15px 40px 15px; 
            border-radius: 4px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center; max-width: 85%; width: 300px;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: rotate(-2deg); 
        }

        .photo-area {
            width: 100%; min-height: 200px; background: #f0f0f0;
            margin-bottom: 20px; display: flex; align-items: center; justify-content: center;
            overflow: hidden; border: 1px solid #eee;
        }
        .result-img { width: 100%; height: auto; display: block; }
        .result-text { font-family: cursive, sans-serif; font-size: 20px; color: #333; line-height: 1.5; padding: 0 10px; }
        .close-btn { margin-top: 20px; background: #333; color: white; border: none; padding: 10px 25px; border-radius: 20px; cursor: pointer; font-size: 14px; }

        @keyframes spinKnob { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes popIn { from { transform: scale(0.5) rotate(10deg); opacity: 0; } to { transform: scale(1) rotate(-2deg); opacity: 1; } }

    </style>
</head>
<body>

<div class="machine-container">
    <div class="gacha-machine">
        <div class="globe" id="globe"></div>
        <div class="base">
            <div class="knob-area" id="knob"><div class="knob-bar"></div></div>
            <div class="exit"></div>
        </div>
    </div>
    <button class="start-btn" id="spinBtn" onclick="spin()">抽取我们的回忆</button>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="polaroid-card">
        <div class="photo-area" id="photoArea"></div>
        <div class="result-text" id="resultText"></div>
        <button class="close-btn" onclick="closeModal()">收藏这份美好</button>
    </div>
</div>

<script>
    // --- 这里的配置是关键！已帮你填好 ---
    const memories = [
        //1.22添加
        { text: "小咪和你和我。", image: "./images/data1.jpg" },
        { text: "旁边生气的猫是我。", image: "./images/data2.jpg" },
        { text: "吃鸡少女", image: "./images/data3.jpg" },
        { text: "沃尔玛的路上总有猫。", image: "./images/data4.jpg" },
        { text: "不知道要去干嘛，总是开心。", image: "./images/data5.jpg" },
        { text: "悲伤情侣。", image: "./images/data6.jpg" },
        { text: "北大街的猫都认识你。", image: "./images/data7.jpg" },
        { text: "又能见你啦。", image: "./images/data8.jpg" },
        { text: "赐你一张人生照片。", image: "./images/data9.jpg" },
        { text: "爱妃平身。", image: "./images/data10.jpg" },
        { text: "学霸少女，冷宫少夫。", image: "./images/data11.jpg" },
        { text: "才子佳人，江南小巷。", image: "./images/data12.jpg" },
        { text: "所爱隔海山。", image: "./images/data13.jpg" },
        { text: "第二次送花。", image: "./images/data14.jpg" },
        { text: "第一次被夸拍的好看。", image: "./images/data15.jpg" },
        { text: "第一次收花。", image: "./images/data16.jpg" },

        //1.23添加
        { text: "我爱上课。", image: "./HYD/images/data17.jpg" },
        { text: "来南昌啦！！！", image: "./images/data18.jpg" },
        { text: "风尘仆仆。", image: "./images/data19.jpg" },
        { text: "换个对象张程沂", image: "./images/data20.jpg" },
        { text: "你怎么比我还像猫。", image: "./images/data21.jpg" },
        { text: "故事开始。", image: "./images/data22.jpg" },
        { text: "我是情圣。", image: "./images/data23.jpg" },
        { text: "感动。", image: "./images/data24.jpg" },
        { text: "小脑袋里在想啥呢。", image: "./images/data25.jpg" },
        { text: "李宁模特。", image: "./images/data26.jpg" },
        { text: "有点想瑟瑟。", image: "./images/data37.jpg" },
        { text: "朦胧少女。", image: "./images/data28.jpg" },
        { text: "吃的真好看。", image: "./images/data29.jpg" },
        { text: "我爱兔子。", image: "./images/data30.jpg" }
    ];

    const colors = ['#ff9ff3', '#feca57', '#ff6b6b', '#48dbfb', '#1dd1a1'];

    window.onload = function() {
        renderBalls();
    };

    function renderBalls() {
        const globe = document.getElementById('globe');
        globe.innerHTML = '';
        // 球的数量根据回忆数量稍微多一点，看着热闹
        const count = Math.max(memories.length * 2, 15);

        for(let i=0; i<count; i++) {
            const ball = document.createElement('div');
            ball.className = 'ball-deco';
            ball.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
            
            const randomX = (Math.random() - 0.5) * 160;
            const randomY = Math.random() * 60;
            
            ball.style.transform = `translate(${randomX}px, -${randomY}px)`;
            
            if(Math.random() > 0.6) ball.innerText = "❤";
            ball.style.color = "rgba(255,255,255,0.8)";
            globe.appendChild(ball);
        }
    }

    let isSpinning = false;
    let chaosInterval; 

    function spin() {
        if(isSpinning) return;

        isSpinning = true;
        const btn = document.getElementById('spinBtn');
        const knob = document.getElementById('knob');

        btn.disabled = true;
        btn.innerText = "回忆加载中...";
        knob.classList.add('spinning');

        // 开始跳动
        startChaos();

        // 1.5秒后出结果
        setTimeout(() => {
            stopChaos();
            knob.classList.remove('spinning');
            
            // 随机抽取
            const result = memories[Math.floor(Math.random() * memories.length)];
            showResult(result);

            btn.disabled = false;
            btn.innerText = "抽取我们的回忆";
            isSpinning = false;
        }, 1500);
    }

    // 乱跳动画逻辑 (0.3秒变一次位置)
    function startChaos() {
        const balls = document.querySelectorAll('.ball-deco');
        chaosInterval = setInterval(() => {
            balls.forEach(ball => {
                const x = (Math.random() - 0.5) * 180;
                const y = -(Math.random() * 140 + 20); 
                const r = Math.random() * 360;
                ball.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg)`;
            });
        }, 300);
    }

    function stopChaos() {
        clearInterval(chaosInterval);
        const balls = document.querySelectorAll('.ball-deco');
        balls.forEach(ball => {
            const x = (Math.random() - 0.5) * 160;
            const dropY = -(Math.random() * 50); 
            ball.style.transform = `translate(${x}px, ${dropY}px) rotate(0deg)`;
        });
    }

    function showResult(item) {
        const overlay = document.getElementById('modalOverlay');
        const photoArea = document.getElementById('photoArea');
        const text = document.getElementById('resultText');

        text.innerText = item.text;

        // 显示图片
        photoArea.innerHTML = `<img src="${item.image}" class="result-img" onerror="this.src='';this.alt='图片加载失败，请检查文件名'">`;
        photoArea.style.display = 'flex';

        overlay.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
    }
</script>
</body>
</html>
